<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>WA Prado Watch</title>
  <style>
    :root{--ink:#17202a;--muted:#69727c;--red:#e50000;--paper:#f5f3ef;--card:#fff;--bronze:#8a6138}
    *{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.45 system-ui,-apple-system,Segoe UI,sans-serif}
    header{background:#101820;color:white;padding:28px max(20px,calc((100% - 1180px)/2))}h1{font-size:clamp(25px,4vw,42px);margin:0 0 5px}header p{margin:0;color:#cbd0d4}
    main{max-width:1180px;margin:auto;padding:24px 20px 60px}.bar{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-bottom:20px}
    button{border:0;border-radius:8px;padding:11px 16px;background:var(--red);color:white;font-weight:700;cursor:pointer}button:disabled{opacity:.55}.status{color:var(--muted)}
    .legend{display:flex;gap:8px;flex-wrap:wrap}.pill{padding:4px 9px;border-radius:99px;background:#e8eaec;font-size:12px;font-weight:700}.new{background:#d9f7e2;color:#17662f}.gx{background:#fff0c2;color:#735000}.wanted{background:#ecd9c5;color:#563818}
    .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:16px}.card{position:relative;background:var(--card);border:1px solid #dfe1e3;border-radius:13px;overflow:hidden;box-shadow:0 2px 9px #0000000d}
    .card.is-gx{border:3px solid #e1a400;box-shadow:0 4px 16px #9b71002c}.card.is-wanted{border:3px solid var(--bronze);box-shadow:0 0 0 4px #d9b89455,0 5px 18px #6a421c33}.card.is-demo{background:repeating-linear-gradient(135deg,#fff,#fff 18px,#f3edff 18px,#f3edff 36px);outline:4px solid #6f3cc3;outline-offset:-4px}.pill.demo{background:#6f3cc3;color:#fff;font-size:13px;letter-spacing:.04em}
    .card.is-screaming{border:5px solid var(--red);background:linear-gradient(145deg,#fff 55%,#fff1b8);box-shadow:0 0 0 5px #ffca00,0 10px 30px #e5000055;animation:attention 1.8s ease-in-out infinite alternate}
    .card.is-screaming:before{content:'TOP MATCH';position:absolute;z-index:2;right:-35px;top:22px;width:150px;padding:7px 0;transform:rotate(36deg);text-align:center;background:var(--red);color:#fff;font-size:12px;font-weight:900;letter-spacing:.08em;box-shadow:0 2px 8px #0005}
    .card.is-screaming h2{color:#b00000;font-size:19px}.card.is-screaming .pill.wanted{background:var(--red);color:#fff;font-size:13px}.card.is-screaming .pill.gx{background:#ffca00;color:#271d00;font-size:13px}
    @keyframes attention{from{box-shadow:0 0 0 4px #ffca00,0 8px 24px #e5000044}to{box-shadow:0 0 0 7px #ffca00,0 13px 36px #e5000077}}
    @media (prefers-reduced-motion:reduce){.card.is-screaming{animation:none}}
    .card img{width:100%;height:165px;object-fit:contain;background:#f7f7f7}.body{padding:16px}.tags{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
    h2{font-size:17px;line-height:1.25;margin:0 0 10px}.meta{display:grid;grid-template-columns:70px 1fr;gap:5px;color:var(--muted)}.meta b{color:var(--ink)}a{color:var(--red);font-weight:700;text-decoration:none}.empty{padding:50px;text-align:center;background:white;border-radius:12px}
    details{margin-top:24px;background:white;border:1px solid #ddd;border-radius:10px;padding:12px 16px}.error{color:#a11}.gone{opacity:.55;filter:grayscale(.7)}
  </style>
</head>
<body><header><h1>WA Prado Watch</h1><p>Checking Toyota dealer stock every {{ interval_hours|round(1) }} hours</p></header>
<main><div class="bar"><div><strong id="count">Loading…</strong><div class="status" id="status"></div></div><button id="scan">Check now</button></div>
<div class="legend"><span class="pill new">NEW SINCE LAST CHECK</span><span class="pill gx">GX</span><span class="pill wanted">ONYX BLACK / DUSTY BRONZE</span></div><div style="height:16px"></div>
<div class="grid" id="cars"></div><details><summary>Dealer check health</summary><div id="health"></div></details></main>
<script>
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function when(s){return s?new Date(s).toLocaleString(): 'Never'}
async function refresh(){
 const [cars,status]=await Promise.all([fetch('/api/vehicles').then(r=>r.json()),fetch('/api/status').then(r=>r.json())]);
 document.querySelector('#count').textContent=`${cars.length} Prado${cars.length===1?'':'s'} currently in stock`;
 document.querySelector('#status').textContent=status.scanning?'Checking dealers now…':`Last checked ${when(status.last_scan?.finished_at)}`;
 document.querySelector('#scan').disabled=status.scanning;
 document.querySelector('#cars').innerHTML=cars.length?cars.map(c=>{const wanted=['onyx black','onyx night','dusty bronze'].includes(c.colour.toLowerCase()),grade=c.grade.toUpperCase(),gx=grade==='GX',demo=(c.condition||'New').toLowerCase()==='demo',screaming=wanted&&gx;return `<article class="card ${gx?'is-gx':''} ${wanted?'is-wanted':''} ${screaming?'is-screaming':''} ${demo?'is-demo':''} ${c.active?'':'gone'}">${c.image_url?`<img loading="lazy" src="${esc(c.image_url)}" alt="${esc(c.title)}">`:''}<div class="body"><div class="tags">${demo?'<span class="pill demo">DEMONSTRATOR VEHICLE</span>':''}${screaming?'<span class="pill wanted">★ PRIORITY MATCH ★</span>':''}${c.is_new?'<span class="pill new">NEW LISTING</span>':'<span class="pill">SEEN BEFORE</span>'}${gx?'<span class="pill gx">GX</span>':''}${wanted?`<span class="pill wanted">★ ${esc(c.colour)}</span>`:''}</div><h2>${esc(c.title)}</h2><div class="meta"><span>Dealer</span><b>${esc(c.dealer)}</b><span>Condition</span><b>${demo?'DEMONSTRATOR':'Brand new'}</b><span>Grade</span><b>${esc(c.grade)}</b><span>Colour</span><b>${esc(c.colour)}</b><span>Price</span><b>${esc(c.price||'Ask dealer')}</b><span>First seen</span><b>${when(c.first_seen)}</b></div><p><a href="${esc(c.detail_url)}" target="_blank" rel="noopener">View at dealer →</a></p></div></article>`}).join(''):'<div class="empty">No Prados found in the latest successful checks.</div>';
 document.querySelector('#health').innerHTML=status.dealers.map(d=>`<p class="${d.ok?'':'error'}">${d.ok?'✓':'⚠'} <b>${esc(d.dealer)}</b> — ${d.ok?`${d.vehicle_count} found`:esc(d.error)}</p>`).join('')||'<p>No checks yet.</p>';
}
document.querySelector('#scan').onclick=async()=>{await fetch('/api/scan',{method:'POST'});refresh();setTimeout(refresh,2500)};refresh();setInterval(refresh,10000);
</script></body></html>
