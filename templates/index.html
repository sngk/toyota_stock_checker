<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Prado Watch</title>
<style>
:root{color-scheme:dark;--ink:#edf1f5;--muted:#9da8b3;--red:#ff4141;--paper:#0b1015;--card:#151c23;--panel:#111820;--line:#2b3641;--bronze:#c4925f}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.45 system-ui,-apple-system,Segoe UI,sans-serif}header{background:#080c10;border-bottom:1px solid var(--line);padding:25px max(20px,calc((100% - 1180px)/2))}h1{font-size:clamp(25px,4vw,40px);margin:0 0 5px}header p{margin:0;color:var(--muted)}main{max-width:1180px;margin:auto;padding:22px 20px 60px}.tabs{display:flex;gap:8px;margin-bottom:20px;border-bottom:1px solid var(--line)}.tab{border-radius:8px 8px 0 0;background:transparent;color:var(--muted);font-size:16px;padding:11px 22px}.tab.active{background:var(--red);color:#fff}.bar{display:flex;gap:16px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-bottom:20px}.actions,.settings{display:flex;gap:9px;align-items:center;flex-wrap:wrap}.settings{color:var(--muted)}button{border:0;border-radius:8px;padding:11px 16px;background:var(--red);color:white;font-weight:700;cursor:pointer}button:disabled{opacity:.55}.status{color:var(--muted)}input,select{background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:7px;padding:9px}input{width:72px}.save{background:#344150}.legend{display:flex;gap:8px;flex-wrap:wrap}.pill{padding:4px 9px;border-radius:99px;background:#2c3640;font-size:12px;font-weight:700}.new{background:#17482a;color:#a8efbd}.gx{background:#614b08;color:#ffe28b}.wanted{background:#563c27;color:#f0c49a}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:16px}.card{position:relative;background:var(--card);border:1px solid var(--line);border-radius:13px;overflow:hidden;box-shadow:0 3px 12px #0007}.card.is-gx{border:3px solid #d6a800;box-shadow:0 4px 16px #d6a8002c}.card.is-wanted{border:3px solid var(--bronze);box-shadow:0 0 0 4px #8e603855,0 5px 18px #0008}.card.is-demo{background:repeating-linear-gradient(135deg,#171e26,#171e26 18px,#211a2d 18px,#211a2d 36px);outline:4px solid #9565e5;outline-offset:-4px}.pill.demo{background:#7645c5;color:#fff;font-size:13px}.card.is-screaming{border:5px solid var(--red);background:linear-gradient(145deg,#171e26 55%,#3d3515);box-shadow:0 0 0 5px #ffca00,0 10px 30px #e5000055;animation:attention 1.8s ease-in-out infinite alternate}.card.is-screaming:before{content:'TOP MATCH';position:absolute;z-index:2;right:-35px;top:22px;width:150px;padding:7px 0;transform:rotate(36deg);text-align:center;background:#e50000;color:#fff;font-size:12px;font-weight:900}.card.is-screaming h2{color:#ff7777}.card.is-screaming .pill.wanted{background:#d92727;color:#fff}.card.is-screaming .pill.gx{background:#ffca00;color:#271d00}@keyframes attention{from{box-shadow:0 0 0 4px #ffca00,0 8px 24px #e5000044}to{box-shadow:0 0 0 7px #ffca00,0 13px 36px #e5000077}}@media(prefers-reduced-motion:reduce){.card.is-screaming{animation:none}}.card img{width:100%;height:165px;object-fit:contain;background:#0e141a}.body{padding:16px}.tags{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}h2{font-size:17px;line-height:1.25;margin:0 0 10px}.meta{display:grid;grid-template-columns:70px 1fr;gap:5px;color:var(--muted)}.meta b{color:var(--ink)}a{color:#ff6969;font-weight:700;text-decoration:none}.empty{padding:50px;text-align:center;background:var(--card);border-radius:12px}details{margin-top:24px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 16px}.error{color:#ff7777}.gone{opacity:.55;filter:grayscale(.7)}
</style></head><body><header><h1>Prado Watch</h1><p id="schedule">Checking Toyota dealer stock every hour</p></header><main><nav class="tabs"><button class="tab active" data-region="wa">Western Australia</button><button class="tab" data-region="nsw">New South Wales</button><button class="tab" data-region="sa">South Australia</button></nav><div class="bar"><div><strong id="count">Loading…</strong><div class="status" id="status"></div></div><div class="actions"><div class="settings"><label for="interval">Check every</label><input id="interval" type="number" min="1" value="1"><select id="unit"><option value="3600">hours</option><option value="60">minutes</option><option value="86400">days</option></select><button class="save" id="save">Save</button></div><button id="scan">Check now</button></div></div><div class="legend"><span class="pill new">NEW SINCE LAST CHECK</span><span class="pill gx">GX</span><span class="pill wanted">ONYX BLACK / DUSTY BRONZE</span></div><div style="height:16px"></div><div class="grid" id="cars"></div><details><summary>Dealer check health</summary><div id="health"></div></details></main>
<script>
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let region='wa',settingsLoaded=false;function when(s){return s?new Date(s).toLocaleString():'Never'}function intervalText(s){if(s%86400===0)return `${s/86400} day${s===86400?'':'s'}`;if(s%3600===0)return `${s/3600} hour${s===3600?'':'s'}`;return `${s/60} minute${s===60?'':'s'}`}function setControls(s){const c=[[86400,'days'],[3600,'hours'],[60,'minutes']].find(([n])=>s%n===0)||[60,'minutes'];document.querySelector('#unit').value=c[0];document.querySelector('#interval').value=s/c[0]}
async function refresh(){const [cars,status]=await Promise.all([fetch(`/api/vehicles?region=${region}`).then(r=>r.json()),fetch(`/api/status?region=${region}`).then(r=>r.json())]);if(!settingsLoaded){setControls(status.interval_seconds);settingsLoaded=true}document.querySelector('#schedule').textContent=`Checking WA, NSW and SA Toyota dealer stock every ${intervalText(status.interval_seconds)}`;document.querySelector('#count').textContent=`${cars.length} Prado${cars.length===1?'':'s'} currently in stock in ${region.toUpperCase()}`;document.querySelector('#status').textContent=status.scanning?'Checking dealers now…':`Last checked ${when(status.last_scan?.finished_at)}`;document.querySelector('#scan').disabled=status.scanning;document.querySelector('#cars').innerHTML=cars.length?cars.map(c=>{const wanted=['onyx black','onyx night','dusty bronze'].includes(c.colour.toLowerCase()),gx=c.grade.toUpperCase()==='GX',demo=(c.condition||'New').toLowerCase()==='demo',screaming=wanted&&gx;return `<article class="card ${gx?'is-gx':''} ${wanted?'is-wanted':''} ${screaming?'is-screaming':''} ${demo?'is-demo':''} ${c.active?'':'gone'}">${c.image_url?`<img loading="lazy" src="${esc(c.image_url)}" alt="${esc(c.title)}">`:''}<div class="body"><div class="tags">${demo?'<span class="pill demo">DEMONSTRATOR VEHICLE</span>':''}${screaming?'<span class="pill wanted">★ PRIORITY MATCH ★</span>':''}${c.is_new?'<span class="pill new">NEW LISTING</span>':'<span class="pill">SEEN BEFORE</span>'}${gx?'<span class="pill gx">GX</span>':''}${wanted?`<span class="pill wanted">★ ${esc(c.colour)}</span>`:''}</div><h2>${esc(c.title)}</h2><div class="meta"><span>Dealer</span><b>${esc(c.dealer)}</b><span>Condition</span><b>${demo?'DEMONSTRATOR':'Brand new'}</b><span>Grade</span><b>${esc(c.grade)}</b><span>Colour</span><b>${esc(c.colour)}</b><span>Price</span><b>${esc(c.price||'Ask dealer')}</b><span>First seen</span><b>${when(c.first_seen)}</b></div><p><a href="${esc(c.detail_url)}" target="_blank" rel="noopener">View at dealer →</a></p></div></article>`}).join(''):'<div class="empty">No Prados found in the latest successful checks.</div>';document.querySelector('#health').innerHTML=status.dealers.map(d=>`<p class="${d.ok?'':'error'}">${d.ok?'✓':'⚠'} <b>${esc(d.dealer)}</b> — ${d.ok?`${d.vehicle_count} found`:esc(d.error)}</p>`).join('')||'<p>No checks yet.</p>'}
document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{region=t.dataset.region;document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x===t));refresh()});document.querySelector('#scan').onclick=async()=>{await fetch(`/api/scan?region=${region}`,{method:'POST'});refresh();setTimeout(refresh,2500)};document.querySelector('#save').onclick=async()=>{const seconds=Math.round(Number(document.querySelector('#interval').value)*Number(document.querySelector('#unit').value)),r=await fetch('/api/settings',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({interval_seconds:seconds})}),data=await r.json();if(!r.ok)return alert(data.error);setControls(data.interval_seconds);refresh()};refresh();setInterval(refresh,10000);
</script></body></html>
